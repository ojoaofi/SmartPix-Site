<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><title>Stepper</title></head>
<body>
<div class="sp-pad sp-alt" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px">
<div class="sp-field"><label for="w">Largura</label><div class="sp-stepper"><button type="button" aria-label="Diminuir largura">−</button><input id="w" type="number" value="5"><em>m</em><button type="button" aria-label="Aumentar largura">+</button></div></div>
<div class="sp-field"><label for="h">Altura</label><div class="sp-stepper"><button type="button" aria-label="Diminuir altura">−</button><input id="h" type="number" value="3"><em>m</em><button type="button" aria-label="Aumentar altura">+</button></div></div>
<div class="sp-field"><label for="q">Quantidade</label><div class="sp-stepper"><button type="button" aria-label="Diminuir quantidade">−</button><input id="q" type="number" value="1"><em>un.</em><button type="button" aria-label="Aumentar quantidade">+</button></div></div>
</div>
</body>
</html>
